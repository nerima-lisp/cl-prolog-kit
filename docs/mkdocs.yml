# cl-prolog-kit documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
# The Nix flake (`nix build .#docs`) drives the same config offline.

site_name: cl-prolog-kit
site_description: >-
  A small, dependency-free Prolog engine for Common Lisp — macro-first rule
  definition, CPS proof search, and a compact, extensible builtin set.
site_author: cl-prolog-kit contributors
site_url: https://nerima-lisp.github.io/cl-prolog-kit/

repo_name: nerima-lisp/cl-prolog-kit
repo_url: https://github.com/nerima-lisp/cl-prolog-kit
edit_uri: edit/main/docs/src/

# Content lives in docs/src (kept from the previous mdBook layout).
docs_dir: src
site_dir: ../site
use_directory_urls: true

# Also passed as --strict by flake.nix's packages.docs. Declaring it here as
# well means `mkdocs serve` applies the same gate, so there is no invocation
# path that silently tolerates a broken link. Use `mkdocs serve --no-strict`
# while drafting.
strict: true

copyright: Copyright &copy; cl-prolog-kit contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/sitemap
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-prolog-kit
      name: cl-prolog-kit on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. Nix vs. ASDF workflows).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols, emoji.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

# DOCS_STANDARD.md fixes these five sections, in this order. They track the
# reader's state: Getting Started has not run anything yet, Guide has it
# working but does not know the design, Reference is looking up one answer
# while writing, Project is about to contribute. Readership falls off along
# that order, so reference sits at the back.
#
# The section names match the directories under docs/src/, so the nav and the
# tree give the same answer to "where does this page live". index.md and
# getting-started.md stay at the root rather than under guide/: a reader who
# has not run anything yet should not have to open the Guide first.
#
# The former Internals section is gone: architecture.md and benchmarks.md are
# both pages a reader consults for one answer, so they moved into reference/.
#
# Guide topics are ordered by dependency, not alphabetically: each page uses
# vocabulary the previous one introduced.
#
# Every page under docs/src/ must appear here — --strict fails the build on an
# unlisted page, which is what keeps this list from falling behind.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Your First Program: guide/first-program.md
      - Querying: guide/querying.md
      - Rule DSL: guide/rule-dsl.md
      - Builtin Goals: guide/builtin-goals.md
      - Arithmetic and Comparison: guide/arithmetic.md
      - DCG Grammars: guide/dcg.md
      - Extending the Engine: guide/extending.md
      - Cookbook: guide/cookbook.md
      - Examples: guide/examples.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference:
      - API: reference/api.md
      - Semantics: reference/semantics.md
      - Conditions and Errors: reference/conditions.md
      - Compatibility: reference/compatibility.md
      - Parser Resource Limits: reference/parser-limits.md
      - Architecture: reference/architecture.md
      - Call Graph Analysis: reference/callgraph.md
      - Benchmarks: reference/benchmarks.md
  - Project:
      - Development: project/development.md

# docs/notes/ is for measurements worth keeping but not worth publishing.
# Without this declaration --strict fails the build the moment one is added.
not_in_nav: |
  notes/
