name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Split from `release` on purpose, unlike workflow-templates/release.yml,
  # which runs `nix flake check` inside the job that holds contents: write.
  # `nix flake check` executes this repository's own code (flake.nix, t/*.lisp),
  # so it runs here with contents: read and nothing else; only the job that
  # publishes gets write access, and that job runs no repository code.
  verify:
    name: Verify flake checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Never publish a release that does not pass its own test suite.
      - name: Verify the tagged tree
        timeout-minutes: 25
        run: nix flake check --print-build-logs

  release:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create the GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Enforces the org invariant "git tag == .asd :version" at the only point
      # where it can still be corrected cheaply. Without this gate the two drift
      # silently, which is how cl-boundary-kit reached :version 1.0.0 while its
      # newest tag was still v0.6.0.
      #
      # The Perl regexp is anchored to the line start so a comment or docstring
      # merely mentioning :version cannot shadow the real field, and an empty
      # result is reported rather than silently compared against the tag.
      #
      # Perl's whitespace and capture syntax is portable across the supported
      # runners, unlike relying on GNU- or BSD-specific sed behavior locally.
      - name: Verify tag matches .asd version
        env:
          PACKAGE: cl-prolog-kit
        run: |
          set -euo pipefail
          asd_version="$(perl -ne '
            if (/^\s*:version\s+"([^"]*)"/) {
              print "$1\n";
              exit;
            }
          ' "$PACKAGE.asd")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$asd_version" ]]; then
            echo "::error::Could not read :version from $PACKAGE.asd" >&2
            exit 1
          fi
          echo "asd=$asd_version tag=$tag_version"
          if [[ "$asd_version" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PACKAGE.asd version $asd_version" >&2
            exit 1
          fi

      # Creates the release as an empty draft. This workflow does not produce a
      # release body at all.
      #
      # As of the 2026-08-01 revision the GitHub Release description is the only
      # canonical changelog in this org; there is no CHANGELOG.md to read from.
      # See RELEASE_STANDARD.md. After this job goes green the maintainer fills
      # the body in and publishes:
      #
      #   gh release edit "$TAG" --notes-file <file> --draft=false
      #
      # `--draft` is load-bearing. Publishing straight away would make "the
      # maintainer forgot the notes" a user-visible state. A draft appears
      # neither under "Latest release" nor in the default output of
      # `gh release list`, so an unfinished release never reaches downstream.
      #
      # `--generate-notes` is deliberately left off. Generated notes are a list
      # of commit titles and PR numbers, and RELEASE_STANDARD.md requires the
      # notes to be selected by "does a user of this package have to change
      # their own code" — a judgement no generator can make.
      #
      # `gh` ships on the runner, so this needs no third-party action at all —
      # one fewer supplier to trust than the template's
      # softprops/action-gh-release.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --draft \
            --notes ""
